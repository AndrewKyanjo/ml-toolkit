[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-gearbox"
version = "0.1.0"
description = "Reusable Machine Learning Toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Andrew Wamala Kyanjo"}
]
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
ml = ["scikit-learn"]

[project.urls]
Homepage = "https://github.com/AndrewKyanjo/ml-toolkit"
Issues = "https://github.com/AndrewKyanjo/ml-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]
